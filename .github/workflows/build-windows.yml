name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Criar configuração do Supabase
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) {
            throw "O secret SUPABASE_URL não foi configurado no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            throw "O secret SUPABASE_ANON_KEY não foi configurado no repositório."
          }

          New-Item -ItemType Directory -Force backend/src/main/resources | Out-Null

          @"
          SUPABASE_URL=$env:SUPABASE_URL
          SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
          SUPABASE_ANIMAL_TABLE=animal
          "@ | Set-Content backend/src/main/resources/supabase.properties -Encoding utf8

      - name: Gerar instalador EXE
        run: .\gradlew.bat :frontend:packageExe

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: BezerraRanch-Windows
          path: frontend/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
